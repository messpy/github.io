<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KENNY'S UNIVERSE — v3</title>
<style>
:root{font-family:system-ui,'Noto Sans JP',sans-serif;color:#edf1ff;background:#080f21}*{box-sizing:border-box}body{margin:0}main{max-width:1040px;margin:auto;padding:22px 16px 70px}h1{margin:0;font-size:clamp(23px,4vw,38px);letter-spacing:.08em}h2{font-size:18px;margin:0 0 12px}.muted{color:#a8b8d9}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.chip{border:1px solid #405273;border-radius:100px;padding:7px 12px;color:#c5d3ef;font-size:12px}.skywrap{position:relative;background:#101a35;border:1px solid #33466b;border-radius:22px;overflow:hidden}canvas{display:block;width:100%;height:410px;touch-action:manipulation}.skylabel{position:absolute;top:15px;left:16px;font-size:13px;color:#d4e0ff;background:#101a35bd;padding:7px 10px;border-radius:10px;pointer-events:none}.legend{position:absolute;bottom:12px;left:14px;font-size:12px;color:#d3def7;pointer-events:none}.panel{background:#131e37;border:1px solid #344769;border-radius:20px;padding:20px;margin-top:18px}.profile{display:grid;grid-template-columns:160px 1fr;gap:20px;align-items:center}.avatar{height:150px;display:grid;place-items:center;border-radius:18px;background:radial-gradient(circle at 50% 35%,#364b79,#15203a);font-size:68px}.name{font-size:26px;font-weight:750}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.fact{padding:11px 13px;background:#1c2b49;border-radius:12px}.fact small{display:block;color:#9eb1d7;margin-bottom:4px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.note{font-size:13px;line-height:1.8;color:#b4c3e0}.footer{font-size:12px;color:#9cadcc;margin-top:16px}#detail{min-height:20px;margin-top:10px;font-size:13px;color:#d4e1ff}@media(max-width:620px){canvas{height:360px}.profile{grid-template-columns:1fr}.avatar{height:125px}.facts{grid-template-columns:1fr 1fr}.panel{padding:15px}}
</style>
</head>
<body>
<main>
<div class="top"><div><h1>KENNY'S UNIVERSE</h1><div class="muted">訪問者の星が暮らす、小さな宇宙</div></div><div class="chip" id="clock"></div></div>
<div class="skywrap"><canvas id="sky" aria-label="訪問者の星と現実の月"></canvas><div class="skylabel" id="skylabel"></div><div class="legend">星をタップすると住人の情報を表示</div></div>
<div class="panel"><div class="row" style="justify-content:space-between"><h2>あなたのプロフィール</h2><span class="chip">初回に一度だけ生成・固定</span></div><div class="profile"><div class="avatar" id="avatar"></div><div><div class="muted">この宇宙の住人</div><div class="name" id="name"></div><div class="muted" id="subtitle"></div><div class="facts" id="facts"></div></div></div><div id="detail"></div></div>
<div class="panel"><h2>この宇宙のルール</h2><p class="note">上の宇宙には自分の星と、ほかの訪問者の星が表示されます。自分の星は初回にランダム生成して、このブラウザに保存します。再訪問しても名前・基本色・性格・星の特徴は変わりません。季節の光や月の形は、現実の日本時間に合わせて変化します。</p><p class="note"><strong>このHTMLはモックです。</strong>ほかの星は共有宇宙の見本として配置したサンプル住人です。別端末・別ブラウザ間で実際の訪問者を共有するには、バックエンドが必要です。</p></div>
<div class="footer" id="footer"></div>
</main>
<script>
(()=>{'use strict';
const STORE='kenny-universe-person-v3',kana=[...'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん'],colors=['#88c9f5','#ffc6db','#b7a3ff','#8ce5cf','#ffd28e','#efab8f','#c1d6ff','#e7b5f4','#b9e2a0'],personalities=['好奇心旺盛','のんびり屋','冒険好き','夜更かし','研究熱心','人なつっこい','おっとり','いたずら好き','夢見がち','几帳面'],talents=['流れ星を見つける','星屑を集める','星座を読む','月と話す','宇宙の音を聞く','彗星を追う','小さな星を育てる','星雲を描く'],textures=['雲の模様','縞模様','クレーター','光る斑点','水面の模様','結晶模様'];
const rand=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n},pick=a=>a[rand(a.length)];
function create(){let name='';for(let i=0;i<2+rand(9);i++)name+=pick(kana);return {id:crypto.randomUUID(),name,planet:pick(['NOVA','LUNA','ORBIT','ASTRA','NEBULA','MIRA'])+'-'+String(rand(1000)).padStart(3,'0'),color:pick(colors),personality:pick(personalities),talent:pick(talents),texture:pick(textures),size:13+rand(11),rings:rand(5)===0,seed:rand(1000000000),born:new Date().toISOString()}}
let me;try{me=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){}if(!me||!me.id||!me.name){me=create();try{localStorage.setItem(STORE,JSON.stringify(me))}catch(e){}}
const fake=[{name:'ルミア',planet:'NOVA-042',color:'#a7c7f5',size:17,texture:'光る斑点',seed:53},{name:'ぽるる',planet:'LUNA-008',color:'#eab8e7',size:14,texture:'雲の模様',seed:91},{name:'ミナト',planet:'MIRA-221',color:'#9be5ce',size:16,texture:'縞模様',seed:143},{name:'ソラ',planet:'ORBIT-777',color:'#ffd28e',size:12,texture:'結晶模様',seed:207}];
const canvas=document.querySelector('#sky'),ctx=canvas.getContext('2d'),stars=[{...me,self:true},...fake];let points=[];
function resize(){const d=devicePixelRatio||1,r=canvas.getBoundingClientRect();canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);points=stars.map((s,i)=>({s,x:35+(Math.abs(Math.sin(s.seed+i*4))*0.9)*(r.width-70),y:55+(Math.abs(Math.cos(s.seed+i*7))*0.78)*(r.height-115)}));draw()}
function draw(){const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);const g=ctx.createLinearGradient(0,0,0,r.height);g.addColorStop(0,'#111f45');g.addColorStop(1,'#0b142c');ctx.fillStyle=g;ctx.fillRect(0,0,r.width,r.height);for(let i=0;i<80;i++){ctx.fillStyle=`rgba(220,232,255,${.25+(i%5)/10})`;ctx.beginPath();ctx.arc((i*83)%r.width,(i*47)%r.height,1+(i%3)/2,0,Math.PI*2);ctx.fill()}points.forEach(p=>{const s=p.s;ctx.save();ctx.shadowColor=s.color;ctx.shadowBlur=s.self?18:10;ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(p.x,p.y,s.size,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=.3;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x-s.size*.3,p.y-s.size*.35,s.size*.3,0,Math.PI*2);ctx.fill();if(s.rings){ctx.globalAlpha=.55;ctx.strokeStyle=s.color;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(p.x,p.y,s.size*1.7,s.size*.55,0,0,Math.PI*2);ctx.stroke()}ctx.restore();ctx.fillStyle='#d9e4ff';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText(s.name,p.x,p.y+s.size+18)})}
function show(s){document.querySelector('#detail').textContent=`${s.name}（${s.planet}） — ${s.texture}の星。${s.self?'あなたの星です。':`${s.name}の星です。`}`}
function profile(){document.querySelector('#avatar').textContent='🌌';document.querySelector('#name').textContent=me.name;document.querySelector('#subtitle').textContent=me.planet;document.querySelector('#facts').innerHTML=[['性格',me.personality],['得意なこと',me.talent],['星の特徴',me.texture],['登録日',new Date(me.born).toLocaleDateString('ja-JP')]].map(x=>`<div class="fact"><small>${x[0]}</small>${x[1]}</div>`).join('')}
function clock(){const d=new Date();document.querySelector('#clock').textContent=d.toLocaleString('ja-JP',{dateStyle:'medium',timeStyle:'short'});document.querySelector('#skylabel').textContent=`${d.getHours()<6||d.getHours()>18?'夜の宇宙':'昼の宇宙'} · ${['日','月','火','水','木','金','土'][d.getDay()]}曜日`;document.querySelector('#footer').textContent=`このページはブラウザだけで動作します · ${location.hostname}`}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,p=points.find(p=>Math.hypot(p.x-x,p.y-y)<p.s.size+12);if(p)show(p.s)});window.addEventListener('resize',resize);profile();clock();resize();setInterval(clock,30000);setInterval(draw,1000);
})();
</script>
</body>
</html>
